  .banner.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

function applyLang() {
  document.documentElement.lang = LANGS[lang];
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });

  $('steps').innerHTML = I18N[lang].steps.map((s) => `<li>${s}</li>`).join('');
  if (lastRender) lastRender();

// ── crypto ────────────────────────────────────────────────────────────
const enc = new TextEncoder();
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
const unhex = (h) => new Uint8Array(h.match(/.{2}/g).map((b) => parseInt(b, 16)));
const sha256 = async (bytes) => new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
async function hmac(keyStr, msgStr) {
  const key = await crypto.subtle.importKey('raw', enc.encode(keyStr), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(msgStr)));
}

let blsPromise = null;
const loadBls = () => (blsPromise ??= import('./vendor/noble-bls12-381.js').then((m) => m.bls12_381).catch(() => null));

async function verifyBls(beacon) {
  const bls = await loadBls();
  if (!bls) return null;
  const roundBytes = new Uint8Array(8);
  new DataView(roundBytes.buffer).setBigUint64(0, BigInt(beacon.round));
  const msg = await sha256(roundBytes);
  try {
    const point = bls.G1.ProjectivePoint.fromAffine(bls.G1.hashToCurve(msg, { DST: DRAND.dst }).toAffine());
    return bls.verifyShortSignature(beacon.signature, point, DRAND.publicKey);
  } catch {
    return false;
  }
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}
async function fetchBeacon(round) {
  let last;
  for (const relay of DRAND.relays) {
    try { return await fetchJson(`${relay}/${DRAND.chainHash}/public/${round}`); } catch (e) { last = e; }
  }
  throw last;
}

// ── verification ──────────────────────────────────────────────────────
async function verify(data) {
  const checks = [];
  const add = (status, text, detail) => checks.push({ status, text, detail });
  const seed = data.drawSeed;

  const seedHash = hex(await sha256(enc.encode(seed)));
  add(seedHash === String(data.drawSeedHash).toLowerCase() ? 'ok' : 'bad', t('cSeed'), seedHash);

  let drawKey = seed;
  if (data.drandRound) {
    const beacon = await fetchBeacon(data.drandRound);
    const sigOk = Number(beacon.round) === Number(data.drandRound) ? await verifyBls(beacon) : false;
    if (sigOk === null) add('warn', t('cBeaconSigSkip'));
    else add(sigOk ? 'ok' : 'bad', t('cBeaconSig', { r: data.drandRound }), `${DRAND.relays[0]}/${DRAND.chainHash}/public/${data.drandRound}`);
    const rand = hex(await sha256(unhex(beacon.signature)));
    add(rand === beacon.randomness ? 'ok' : 'bad', t('cBeaconRand'), rand);
    add(beacon.randomness === data.drandRandomness ? 'ok' : 'bad', t('cBeaconMatch'));
    const roundTime = DRAND.genesis + (Number(data.drandRound) - 1) * DRAND.period;
    const closeGap = Math.round(roundTime - Date.parse(data.endAt) / 1000);
    add(closeGap >= CLOSE_MARGIN_SEC ? 'ok' : 'bad', t('cTiming', { d: closeGap, m: CLOSE_MARGIN_SEC }), new Date(roundTime * 1000).toISOString());
    if (data.drawnAt) {
      const drawGap = Math.round(Date.parse(data.drawnAt) / 1000 - roundTime);
      add(drawGap >= 0 ? 'ok' : 'bad', t('cDrawn', { d: drawGap }));
    }
    drawKey = hex(await hmac(seed, beacon.randomness));
  } else {
    add('info', t('cLegacy'));
  }

  const entries = data.participants
    .map((p) => (Array.isArray(p) ? [Number(p[0]), Number(p[1])] : [Number(p.userId), Number(p.ticketCount)]))
    .filter((e) => e[1] > 0)
    .sort((a, b) => a[0] - b[0]);
  const snapshot = entries.map((e) => [...e]);
  const totalTickets = entries.reduce((s, e) => s + e[1], 0);
  const ticketHash = hex(await sha256(enc.encode(JSON.stringify(entries))));
  add(ticketHash === String(data.ticketListHash).toLowerCase() ? 'ok' : 'bad',
    t('cTickets', { p: entries.length, t: totalTickets }), ticketHash);

  const rows = [];
  for (const w of data.winners) {
    if (!entries.length) { rows.push({ w, uid: null }); continue; }
    const h = await hmac(drawKey, `${data.contestId}:${w.drawIndex}:${ticketHash}`);
    const num = new DataView(h.buffer).getUint32(0);
    const target = (num / 0x100000000) * entries.reduce((s, e) => s + e[1], 0);
    let acc = 0, idx = 0;
    for (let i = 0; i < entries.length; i++) { acc += entries[i][1]; if (target < acc) { idx = i; break; } }
    const uid = entries[idx][0];
    rows.push({ w, uid });
    entries[idx][1] -= 1;
    if (entries[idx][1] <= 0) entries.splice(idx, 1);
  }
  const mismatches = rows.filter((r) => r.uid !== Number(r.w.userId)).length;
  if (rows.length) {
    add(mismatches ? 'bad' : 'ok', mismatches ? t('cWinnersBad', { n: mismatches, total: rows.length }) : t('cWinners', { n: rows.length }));
  }

  return { checks, rows, snapshot, totalTickets, ok: checks.every((c) => c.status !== 'bad') };
}

// ── rendering ─────────────────────────────────────────────────────────
let lastRender = null;
const ICON = { ok: ['✓', 'i-ok'], bad: ['✗', 'i-bad'], warn: ['!', 'i-warn'], info: ['·', 'i-info'] };

function renderPending(data) {
  lastRender = () => {
    $('out').innerHTML = `
      <div class="banner info">${esc(t('notDrawn'))}</div>
      <div class="panel">
        <strong>#${esc(data.contestId)} ${esc(data.title || '')}</strong>
        <ul class="checks">
        <li><span class="i-info">·</span><span>${esc(t('commitment'))}<span class="detail">${esc(data.drawSeedHash)}</span></span></li>
        <li><span class="i-info">·</span><span>${data.drandRound
          ? `${esc(t('pinned'))}: <a href="${DRAND.relays[0]}/${DRAND.chainHash}/public/${data.drandRound}">#${esc(data.drandRound)}</a>`
          : esc(t('notPinned'))}</span></li>
      </ul></div>${foundNote(data)}`;
  };
  lastRender();
}

let lookedUpByHash = false;
const foundNote = (data) => (lookedUpByHash ? `<p class="muted">${esc(t('foundByHash', { id: data.contestId }))}</p>` : '');

function renderResult(data, res) {
  lastRender = () => {
    const me = Number($('me').value) || null;
    const mine = me ? res.snapshot.find((e) => e[0] === me) : null;
    const youLine = me
      ? `<p>${esc(mine
          ? t('you', { id: me, t: mine[1], total: res.totalTickets, pct: ((mine[1] / res.totalTickets) * 100).toFixed(2) })
          : t('youNone', { id: me }))}</p>`
      : '';
    $('out').innerHTML = `
      <div class="banner ${res.ok ? 'ok' : 'bad'}">${esc(res.ok ? t('allOk') : t('someBad'))}</div>
      <div class="panel">
        <strong>#${esc(data.contestId)} ${esc(data.title || '')}</strong>
        <ul class="checks">${res.checks.map((c) => `
          <li><span class="${ICON[c.status][1]}">${ICON[c.status][0]}</span>
          <span>${esc(c.text)}${c.detail ? `<span class="detail">${esc(c.detail)}</span>` : ''}</span></li>`).join('')}
        </ul>
      </div>
      ${foundNote(data)}
      <h2>${esc(t('winners'))}</h2>
      ${youLine}
      <div class="panel table-wrap"><table>
        <thead><tr><th>#</th><th>${esc(t('thPrize'))}</th><th>${esc(t('thRecomputed'))}</th><th>${esc(t('thAnnounced'))}</th><th></th></tr></thead>
        <tbody>${res.rows.map((r) => {
          const ok = r.uid === Number(r.w.userId);
          return `<tr class="${me && Number(r.w.userId) === me ? 'me' : ''}">
            <td>${r.w.drawIndex}</td><td class="prize">${esc(r.w.displayName || r.w.prizeId)}</td>
            <td class="mono">#${esc(r.uid ?? '—')}</td><td class="mono">#${esc(r.w.userId)}</td>
            <td class="${ok ? 'i-ok' : 'i-bad'}">${ok ? '✓' : '✗'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
      <details><summary>${esc(t('participants'))} (${res.snapshot.length})</summary>
        <div class="panel participants table-wrap"><table><tbody>${res.snapshot.map(([u, c]) =>
          `<tr class="${u === me ? 'me' : ''}"><td class="mono">#${u}</td><td class="mono">×${c}</td></tr>`).join('')}
        </tbody></table></div>
      </details>`;
  };
  lastRender();
}

async function run() {
  const btn = $('run');
  btn.disabled = true;
  $('out').innerHTML = `<div class="banner info">${esc(t('loading'))}</div>`;
  try {
    let data;
    lookedUpByHash = false;
    const pasted = $('json').value.trim();
    if (pasted) {
      data = JSON.parse(pasted);
    } else {
      const q = $('contest').value.trim().replace(/^#/, '');
      const api = $('api').value.replace(/\/$/, '');
      const url = new URL(location.href);
      url.searchParams.delete('contest');
      url.searchParams.delete('hash');
      if (/^[0-9a-f]{64}$/i.test(q)) {
        url.searchParams.set('hash', q.toLowerCase());
        history.replaceState(null, '', url);
        const r = await fetch(`${api}/contests/fairness/by-hash/${q.toLowerCase()}`);
        if (r.status === 404) throw new Error(t('hashNotFound'));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
        lookedUpByHash = true;
      } else if (/^\d+$/.test(q)) {
        url.searchParams.set('contest', q);
        history.replaceState(null, '', url);
        data = await fetchJson(`${api}/contests/${q}/fairness`);
      } else {
        throw new Error(t('badInput'));
      }
    }
    if (data.status !== 'completed' || !data.drawSeed) renderPending(data);
    else renderResult(data, await verify(data));
  } catch (e) {
    lastRender = null;
    $('out').innerHTML = `<div class="banner bad">${esc(t('error'))}${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
$('run').addEventListener('click', run);
$('contest').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
$('me').addEventListener('input', () => lastRender && lastRender());
applyLang();
loadBls();

const qs = new URLSearchParams(location.search);
if (qs.get('me')) $('me').value = qs.get('me');
const preset = qs.get('hash') || qs.get('contest');
if (preset) { $('contest').value = preset; run(); }
</script>
</body>
</html>
